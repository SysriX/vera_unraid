# Baut VERA-Connect für Windows als eine Datei (Nuitka – kein Python nötig) und testet es auf einem frischen Windows:
# VERA + nachgebaute OPNsense starten, Setup still mit Parametern installieren, Rechner in VERA freigeben,
# prüfen, dass WireGuard (offizielles MSI) installiert, der Tunnel als Dienst eingerichtet und der WireGuard-Manager aus ist,
# Tray-Selbsttest, wieder entfernen. Ergebnis: Release „connect-windows“ mit VERA-Connect-Setup.exe.
name: VERA-Connect Windows

on:
  push:
    branches: [main]
    paths: ['connect/**', 'app/clients.py', 'tools/connect_ci.py', '.github/workflows/connect-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Werkzeuge
        run: pip install nuitka==4.3.5 ordered-set zstandard

      - name: Kompilieren (Nuitka, eine Datei)
        shell: pwsh
        run: |
          trap { Write-Host ("::error title=Kompilieren::" + "$_".Replace("`n",'%0A')); break }
          $v = (Select-String -Path connect/vera_connect.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:PYTHONPATH = "connect"
          python -m nuitka --onefile --assume-yes-for-downloads --include-module=winservice --include-module=tray --include-module=ed25519 `
            --windows-console-mode=attach --windows-icon-from-ico=connect/vera-connect.ico --python-flag=no_asserts --python-flag=no_docstrings `
            --windows-company-name=SysriX --windows-product-name="VERA-Connect" --windows-file-description="VERA-Connect (WireGuard-Verbindung zu VERA)" `
            --windows-file-version=$v --windows-product-version=$v --output-filename=VERA-Connect-Setup.exe --output-dir=dist connect/vera_connect.py
          if (-not (Test-Path dist/VERA-Connect-Setup.exe)) { throw "VERA-Connect-Setup.exe fehlt" }
          $mb = "{0:N1} MB" -f ((Get-Item dist/VERA-Connect-Setup.exe).Length / 1MB)
          Write-Host "::notice title=Gebaut::VERA-Connect-Setup.exe $v, $mb"

      # Ein Schritt: GitHub beendet Hintergrundprozesse am Ende jedes Schritts.
      - name: Test – installieren, freigeben, WireGuard + Tunnel, Tray, entfernen
        shell: pwsh
        run: |
          # Bei einem Fehler: Protokolle als Anmerkung + Zusammenfassung (öffentlich sichtbar, Logs brauchen sonst ein Login)
          function Diag($msg) {
            $d = "$env:ProgramData\VERA-Connect"
            $parts = @("FEHLER: $msg",
              "--- connect.log", ((Get-Content "$d\connect.log" -Tail 40 -ErrorAction SilentlyContinue) -join "`n"),
              "--- status.json", ((Get-Content "$d\status.json" -ErrorAction SilentlyContinue) -join ""),
              "--- connect-crash.txt", ((Get-Content "$d\connect-crash.txt" -Tail 30 -ErrorAction SilentlyContinue) -join "`n"),
              "--- connect.out", ((Get-Content "$d\connect.out" -Tail 20 -ErrorAction SilentlyContinue) -join "`n"),
              "--- vera.err", ((Get-Content vera.err -Tail 20 -ErrorAction SilentlyContinue) -join "`n"),
              "--- Dienste", ((sc.exe query VeraConnect) -join "`n"))
            $body = $parts -join "`n"
            "## VERA-Connect-Test`n" + '```' + "`n$body`n" + '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            Write-Host ("::error title=VERA-Connect-Test::" + $body.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A'))
          }
          trap { Diag "$_"; break }
          pip install -r requirements.txt
          New-Item -ItemType Directory -Force cfg | Out-Null
          $env:PYTHONUTF8 = "1"
          Start-Process python -ArgumentList 'tools/mock_opnsense.py 18101 a' -RedirectStandardOutput mock.log -RedirectStandardError mock.err -WindowStyle Hidden
          $env:VERA_DATA = "$PWD\cfg"; $env:VERA_PORT = "18110"; $env:VERA_SETUP_CODE = "CI-TEST"
          Start-Process python -ArgumentList 'main.py' -WorkingDirectory app -RedirectStandardOutput vera.log -RedirectStandardError vera.err -WindowStyle Hidden
          Start-Sleep 8
          Write-Host "::notice title=Test::VERA läuft, Setup des Tests"
          python tools/connect_ci.py setup
          if ($LASTEXITCODE -ne 0) { Get-Content vera.log, vera.err; throw "VERA-Setup" }
          .\dist\VERA-Connect-Setup.exe version
          $p = Start-Process .\dist\VERA-Connect-Setup.exe -ArgumentList '/S','URL=http://127.0.0.1:18110' -PassThru -Wait
          "Setup beendet mit $($p.ExitCode)"
          Get-Content "$env:ProgramData\VERA-Connect\connect.log" -ErrorAction SilentlyContinue
          sc.exe query VeraConnect
          Write-Host "::notice title=Test::VERA-Connect installiert, Dienst läuft"
          $out = python tools/connect_ci.py approve $env:COMPUTERNAME 2>&1 | Out-String; $out
          if ($LASTEXITCODE -ne 0) { throw "Freigabe: $out" }
          Write-Host "::notice title=Test::Rechner in VERA freigegeben"
          $out = python tools/connect_ci.py check $env:COMPUTERNAME 2>&1 | Out-String; $out
          $ok = $LASTEXITCODE
          "--- Protokoll VERA-Connect"; Get-Content "$env:ProgramData\VERA-Connect\connect.log" -ErrorAction SilentlyContinue
          "--- Status"; Get-Content "$env:ProgramData\VERA-Connect\status.json" -ErrorAction SilentlyContinue
          if ($ok -ne 0) { throw "Kein Bericht: $out" }
          Write-Host "::notice title=Test::Bericht mit WireGuard an VERA"
          if (-not (Test-Path "$env:ProgramFiles\WireGuard\wireguard.exe")) { throw "WireGuard nicht installiert" }
          sc.exe query 'WireGuardTunnel$CI'
          if ($LASTEXITCODE -ne 0) { throw "Tunnel-Dienst fehlt" }
          sc.exe query WireGuardManager
          if ($LASTEXITCODE -eq 0 -and ((sc.exe query WireGuardManager) -match 'RUNNING')) { throw "WireGuard-Manager läuft noch" }
          "--- Rechte der Tunnel-Datei (nur SYSTEM/Administratoren)"
          icacls "$env:ProgramData\VERA-Connect\tunnel\CI.conf"
          if ((icacls "$env:ProgramData\VERA-Connect\tunnel\CI.conf") -match 'S-1-5-32-545|BUILTIN\\Users|VORDEFINIERT\\Benutzer') { throw "Tunnel-Datei für Benutzer lesbar" }
          Write-Host "::notice title=Test::WireGuard installiert, Tunnel-Dienst da, Manager aus, Rechte ok"
          "--- Wiederherstellen: Tunnel-Dienst von Hand entfernen"
          & "$env:ProgramFiles\WireGuard\wireguard.exe" /uninstalltunnelservice CI
          Start-Sleep 70
          sc.exe query 'WireGuardTunnel$CI'
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:ProgramData\VERA-Connect\connect.log" -Tail 15; throw "Tunnel wurde nicht wiederhergestellt" }
          Write-Host "::notice title=Test::Tunnel nach Löschen wiederhergestellt"
          "--- Tray"
          $run = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').'VERA-Connect'; "Autostart: $run"
          if ($run -notmatch 'vera-connect\.exe" tray') { throw "Tray-Autostart fehlt" }
          $t = Start-Process "$env:ProgramFiles\VERA-Connect\vera-connect.exe" -ArgumentList "tray","--selbsttest","3" -PassThru -Wait -NoNewWindow
          if ($t.ExitCode -ne 0) { throw "Tray-Selbsttest" }
          "--- Apps & Features"
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\VERA-Connect' | Select-Object DisplayName, DisplayVersion, UninstallString
          Write-Host "::notice title=Test::Tray-Selbsttest ok"
          "--- Entfernen"
          & "$env:ProgramFiles\VERA-Connect\vera-connect.exe" uninstall /S
          Start-Sleep 5
          sc.exe query VeraConnect
          if ($LASTEXITCODE -eq 0) { throw "Dienst noch da" }
          sc.exe query 'WireGuardTunnel$CI'
          if ($LASTEXITCODE -eq 0) { throw "Tunnel noch da" }
          Write-Host "::notice title=Test::Entfernt – alles ok"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: vera-connect-windows
          path: dist/VERA-Connect-Setup.exe

      - name: Release „connect-windows“ aktualisieren
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view connect-windows >/dev/null 2>&1 || gh release create connect-windows --title "VERA-Connect (Windows)" --notes "Wird automatisch gebaut."
          gh release upload connect-windows dist/VERA-Connect-Setup.exe --clobber
          gh release edit connect-windows --notes "VERA-Connect ${VERSION} für Windows – automatisch gebaut und auf einem frischen Windows getestet (Installation, Freigabe, WireGuard, Tunnel, Tray, Entfernen)."
